name: docker-publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "requirements.txt"
      - "requirements-web.txt"
      - "web/**"
      - "cpa_xai/**"
      - "*.py"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional extra image tag (e.g. beta)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  # needed for GITHUB_TOKEN to push to GHCR with provenance attestations disabled/enabled cleanly
  id-token: write
  attestations: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # ghcr.io/owner/repo (lowercase required by GHCR)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name (lowercase)
        run: |
          echo "IMAGE_NAME_LC=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          tags: |
            # main → latest
            type=raw,value=latest,enable={{is_default_branch}}
            # git sha short
            type=sha,prefix=sha-,format=short
            # v1.2.3 / v1.2.3-rc.1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # manual extra tag from workflow_dispatch
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=grok-register
            org.opencontainers.image.description=Grok Register WebUI/CLI with Chromium + Xvfb
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Single arch keeps CI lighter; Chromium multi-arch is slow/large.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Summary
        run: |
          {
            echo "## Image published"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Pull example:"
            echo ""
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest"
            echo "docker run --rm -p 8092:8092 -v \"\$PWD/data:/data\" --shm-size=512m \\"
            echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
